name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Pinned: ubuntu-latest moved to 26.04, where this job's Playwright 1.56 cannot install Chromium.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # Throwaway CI database credentials only — not real secrets.
      TEST_DB_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
      MIGRATION_DATABASE_URL: postgres://postgres:postgres@localhost:5432/cba_ci
      DATABASE_URL: postgres://cba_app:cba_app_ci_password_123@localhost:5432/cba_ci
      PLATFORM_DATABASE_URL: postgres://cba_platform:cba_platform_ci_password_123@localhost:5432/cba_ci
      CBA_APP_PASSWORD: cba_app_ci_password_123
      CBA_PLATFORM_PASSWORD: cba_platform_ci_password_123
      APP_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
      APP_URL: http://localhost:3000
      STORAGE_LOCAL_DIR: /tmp/cba-storage
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Unit + integration tests (core, server)
        run: pnpm test
      - name: Prepare database for E2E
        run: |
          psql "$TEST_DB_ADMIN_URL" -c "create database cba_ci"
          pnpm db:migrate
          pnpm --filter @cba/server db:setup-roles
          pnpm db:seed
      - name: Build web and admin
        run: pnpm build
      - name: Install Playwright browser
        run: pnpm --filter @cba/web exec playwright install --with-deps chromium
      - name: End-to-end tests
        run: pnpm test:e2e
        env:
          CI_DEMO: "1" # the demo account was seeded above, so run the mobile test too
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  # New MySQL/Express backend + PWA (Step 1). Runs on both engines Hostinger may give you.
  v2-api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        db: ["mariadb:11.4", "mysql:8.4"]
    services:
      db:
        image: ${{ matrix.db }}
        env:
          # Throwaway CI credentials only.
          MARIADB_ROOT_PASSWORD: ci_root_pw
          MYSQL_ROOT_PASSWORD: ci_root_pw
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pci_root_pw || mariadb-admin ping -h 127.0.0.1 -uroot -pci_root_pw"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      DB_HOST: 127.0.0.1
      TEST_DB_ADMIN_USER: root
      TEST_DB_ADMIN_PASSWORD: ci_root_pw
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @biz/api typecheck && pnpm --filter @biz/pwa typecheck
      - name: API integration tests (real database)
        run: pnpm --filter @biz/api test
      - name: PWA tests
        run: pnpm --filter @biz/pwa test
      - name: Production build (single folder for Hostinger)
        run: pnpm --filter @biz/pwa build && pnpm --filter @biz/api build

  android-core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Kotlin core tests + Android debug build
        working-directory: apps/android
        # GitHub runners include the Android SDK, so :app is compiled here too.
        run: ./gradlew :core:test :app:assembleDebug --no-daemon
      - name: Upload debug APK (for testing on a phone — not a release build)
        uses: actions/upload-artifact@v4
        with:
          name: crazy-business-debug-apk
          path: apps/android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

  docker-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build the production image (Hostinger VPS stack)
        run: docker build -t crazy-business:ci .
      - name: Validate the compose file
        working-directory: deploy/hostinger
        run: cp .env.example .env && sed -i 's/^\(DB_OWNER_PASSWORD\|CBA_APP_PASSWORD\|CBA_PLATFORM_PASSWORD\|APP_SECRET\|CRON_SECRET\)=$/\1=ci/' .env && docker compose config -q
